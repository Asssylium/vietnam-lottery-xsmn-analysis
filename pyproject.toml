[project]
name = "vietnam-lottery-xsmn-xsmt-data"
version = "0.1.0"
description = "Validated province-level XSMN and XSMT lottery data feeds."
authors = [
    {name = "Khiem Doan", email = "doankhiem.crazy@gmail.com"},
]

readme = "README.md"
license = {text = "MIT"}

requires-python = "==3.15.*"

dependencies = [
    "tzdata==2026.5",
    "pydantic==2.14.1",
    "cloudscraper==1.2.71",
    "tenacity==9.2.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
]

[dependency-groups]
testing = [
    "pytest",
    "pytest-asyncio",
]
linting = [
    "isort",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.isort]
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
